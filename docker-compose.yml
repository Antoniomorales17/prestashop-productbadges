services:
  db:
    image: mysql:5.7
    container_name: pb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prestashop
    volumes:
      - mysql-data:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:1.7.8.11-apache
    container_name: pb-prestashop
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      PS_DEV_MODE: "true"
      DB_SERVER: db
      DB_USER: root
      DB_PASSWD: root
      DB_NAME: prestashop
      PS_INSTALL_AUTO: "1"
      PS_DOMAIN: "localhost:8080"
      PS_FOLDER_ADMIN: "admin-dev"
    volumes:
      - ps-data:/var/www/html
      - ./modules/productbadges:/var/www/html/modules/productbadges

volumes:
  mysql-data:
  ps-data: